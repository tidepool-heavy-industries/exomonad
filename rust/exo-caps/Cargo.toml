[package]
name = "exo-caps"
version = "0.1.0"
edition = "2021"
description = "Capability traits + domain types — the seam between exo-framework/exo (decision logic) and exo-runtime (IO)."

[lib]
name = "exo_caps"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# `raw_value` backs `MessageKind::Domain(Box<RawValue>)` — domain-opaque inter-node payload erasure.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
