[package]
name = "exo-node"
version = "0.1.0"
edition = "2021"
description = "The per-node sidecar: assembles exo-runtime + exo-framework (with an injected domain roster) into the two-loop node mode (outbound MCP serve + inbound ingestion-inbox watch)."

[lib]
name = "exo_node"
path = "src/lib.rs"

[dependencies]
exo-caps = { path = "../exo-caps" }
exo-runtime = { path = "../exo-runtime" }
exo-framework = { path = "../exo-framework" }
exo-scry = { path = "../exo-scry" }

libc = "0.2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Outbound MCP (N1): the rmcp server that exposes the role's tools over stdio.
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
# Inbound watch (N2b): event-driven file watching — never a poll loop, never hand-rolled inotify.
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
