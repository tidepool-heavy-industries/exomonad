[package]
name = "exo"
version = "0.1.0"
edition = "2021"
description = "The minimal domain usage of exo-framework: concrete tools, roles, gates, and the roster the node binary injects into the engine."

[lib]
name = "exo"
path = "src/lib.rs"

[[bin]]
name = "exo"
path = "src/main.rs"

[dependencies]
exo-caps = { path = "../exo-caps" }
exo-framework = { path = "../exo-framework" }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Bin (the node entrypoint + the full `exo init`/`node`/`hook` CLI) only: assemble the engine
# sidecar with the domain roster injected, plus the root-session bootstrap. The lib stays generic
# over the cap traits and never references these. None of these link classic `exomonad-core` —
# `exo-runtime`/`exomonad-shared` are the v2/shared seam, keeping `exo` classic-core-free.
exo-node = { path = "../exo-node" }
exo-runtime = { path = "../exo-runtime" }
exomonad-shared = { path = "../exomonad-shared", version = "0.1.0" }
anyhow = { workspace = true }
clap = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
shell-escape = "0.1"
