[package]
name = "teams-mcp"
version = "0.1.0"
edition = "2021"
description = "Standalone stdio MCP server: a Swiss-army-knife for Claude Teams, self-identifying via the exo-scry library."

[[bin]]
name = "teams-mcp"
path = "src/main.rs"

[dependencies]
exo-scry = { path = "../exo-scry" }
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
