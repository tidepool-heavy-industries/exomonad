[package]
name = "exo-scry"
version = "0.1.0"
edition = "2021"
description = "Derive a Claude Code session's active team from live OS state (/proc, inotify, tmux) — zero registration."

[lib]
name = "exo_scry"
path = "src/lib.rs"

[[bin]]
name = "exo-scry"
path = "src/bin/exo-scry.rs"

[dependencies]
procfs = "0.17"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
