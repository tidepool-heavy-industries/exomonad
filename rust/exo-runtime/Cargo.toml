[package]
name = "exo-runtime"
version = "0.1.0"
edition = "2021"
description = "IO implementations of the exo-caps capability traits — the runtime side of the seam."

[lib]
name = "exo_runtime"
path = "src/lib.rs"

[dependencies]
exo-caps = { path = "../exo-caps" }
exo-scry = { path = "../exo-scry" }
# Reuse exomonad's proven, classic-free capability code (TmuxIpc, agent-launch
# builder, domain/protocol types) behind the exo-caps traits, rather than
# reimplementing. The shared crate never links classic, so neither does exo-runtime.
exomonad-shared = { path = "../exomonad-shared", version = "0.1.0" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
# Quote values interpolated into the agent launch command pasted into a tmux pane.
shell-escape = "0.1"
sha2 = "0.10"
# killpg for the gate-timeout process-group kill (Process::run_with_timeout).
nix = { workspace = true }
