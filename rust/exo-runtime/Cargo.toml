[package]
name = "exo-runtime"
version = "0.1.0"
edition = "2021"
description = "IO implementations of the exo-caps capability traits — the runtime side of the seam."

[lib]
name = "exo_runtime"
path = "src/lib.rs"

[dependencies]
exo-caps = { path = "../exo-caps" }
exo-scry = { path = "../exo-scry" }
# Reuse exomonad's proven capability implementations (TmuxIpc, GitWorktreeService,
# GitHubService, agent-launch) behind the exo-caps traits, rather than reimplementing.
exomonad-core = { path = "../exomonad-core", version = "0.1.0" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
# Quote values interpolated into the agent launch command pasted into a tmux pane.
shell-escape = "0.1"

# Pre-pinned for the Wave-1 cap impls, so parallel leaves never collide on Cargo.toml:
#   octocrab → GitHub cap;  notify → Bus inbox watch;  nix → signals/fs in Spawner/Tmux teardown.
octocrab = { workspace = true }
notify = { workspace = true }
nix = { workspace = true }
