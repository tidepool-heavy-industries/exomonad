default_role = "tl"
project_dir = "."
tmux_session = "EXOMONAD"
port = 7433
yolo = true
otlp_endpoint = "http://localhost:4317"

[extra_mcp_servers.notebooklm]
type = "stdio"
command = "vendor/notebooklm-mcp/result/bin/notebooklm-mcp"
args = []

# Run the reviewer + ephemeral workers on Kimi-K2 via the local claude-code-proxy (still
# Claude processes, so Teams/hooks/MCP are unchanged). "kimi" is a built-in named brain;
# omit a role ⇒ it stays the default model. Full-table form available for a custom backend.
[launch_profile]
reviewer = "kimi"
worker = "kimi"
