default_role = "tl"
project_dir = "."
tmux_session = "EXOMONAD"
port = 7433
yolo = true
otlp_endpoint = "http://localhost:4317"

[extra_mcp_servers.notebooklm]
type = "stdio"
command = "vendor/notebooklm-mcp/result/bin/notebooklm-mcp"
args = []

# Run the reviewer on Kimi-K2 via the local claude-code-proxy (still a Claude process,
# so Teams/hooks/MCP are unchanged). Unset this table ⇒ a normal Sonnet reviewer.
[launch_profile.reviewer]
base_url = "http://localhost:18765"
model = "kimi-for-coding"
auth_token = "unused"   # proxy holds the real OAuth; this value is ignored
label = "kimi"
